on:
  workflow_call:
    inputs: 
      dotnet-version:
        required: false 
        type: string

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: 🗃️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: 🔎 Find all .NET test projects
        id: discover
        run: |
          projects=$(find . -name "*Tests.csproj" -o -name "*.Test.csproj" -o -name "*.Tests.csproj")
          arr=()
          for p in $projects; do
            filename=$(basename "$p")
            name="${filename%.csproj}"   # remove .csproj
            items+=("{\"name\":\"$name\",\"path\":\"$p\"}")
          done

          json="[$(IFS=,; echo "${items[*]}")]"
          
          echo "Found test projects: $json"
          echo "matrix={\"project\":$json}" >> $GITHUB_OUTPUT

  run:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    name: ${{ matrix.project.name }}

    steps:
      - name: 🗃️ Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: 🔄 Restore
        run: dotnet restore "${{ matrix.project.path }}"

      - name: 🏃‍♂️‍➡️ Run Test
        run: |
          mkdir -p test-results
          dotnet test "${{ matrix.project.path }}" \
            --logger "trx;LogFileName=${{ matrix.project.name }}.trx" \
            --results-directory test-results
      
      - name: 📤 Upload TRX results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project.name }}
          path: test-results
